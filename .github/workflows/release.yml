name: release
# A tag v<version>-miner.<n> builds the ting binary for five platforms and makes a
# draft release of them, published by hand once CI passes on the same tag. On a pull
# request that changes this file, or run by hand, the workflow only builds. MINER.md
# says how to download and check one.
on:
  push:
    tags: ['v*-miner.*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
# Only the release job writes: the draft release and its attestations.
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag carries the node's version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' node/Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(.+)-miner\.[1-9][0-9]*$ || "${BASH_REMATCH[1]}" != "$version" ]]; then
              echo "::error::$GITHUB_REF_NAME is not v$version-miner.<n>, the version being node/Cargo.toml's"
              exit 1
            fi
            name=$GITHUB_REF_NAME
          else
            name=v$version-dev.${GITHUB_SHA::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on Apple silicon as well, where the runner has no Rosetta to run it.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          # In Ubuntu 22.04, whose glibc 2.35 the binary then needs: it runs on the
          # distributions of the last few years, Ubuntu 22.04 and Debian 12 on.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: ubuntu:22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: ubuntu:22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ting-miner-${{ needs.version.outputs.name }}-${{ matrix.target }}
    steps:
      - name: Rust and a linker in the container
        if: matrix.container
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl gcc git libc6-dev
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: Build
        run: cargo build --release --locked --package ting-node --bin ting --target "$TARGET"
      - name: The binary reports the node's version
        if: ${{ !matrix.cross }}
        run: test "$("target/$TARGET/release/ting${{ matrix.exe }}" --version)" = "ting ${{ needs.version.outputs.version }}"
      - name: The binary is for an Intel Mac
        if: matrix.cross
        run: test "$(lipo -archs "target/$TARGET/release/ting")" = x86_64
      - name: Package
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp "target/$TARGET/release/ting${{ matrix.exe }}" LICENSE-APACHE LICENSE-MIT README.md MINER.md "dist/$ARCHIVE/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "$ARCHIVE.zip" "$ARCHIVE"
          else
            tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}.*
          if-no-files-found: error
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      id-token: write # the attestations' signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ting-miner-* > SHA256SUMS
      - name: Attest that this workflow built the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ting-miner-*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Ting miner $GITHUB_REF_NAME" --notes-file - <<EOF
          Built by .github/workflows/release.yml from $GITHUB_SHA. To check an archive:

              shasum -a 256 --check --ignore-missing SHA256SUMS
              gh attestation verify <archive> --repo $GITHUB_REPOSITORY

          MINER.md, in each archive, says how to configure and run the miner.
          EOF
